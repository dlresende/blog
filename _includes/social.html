<ul class="social-media-list">
  {%- if site.github_username -%}
    <li>
      <a href="https://github.com/{{ site.github_username| cgi_escape | escape }}" title="GitHub" aria-label="GitHub">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
      </a>
    </li>
  {%- endif -%}
  {%- for mst in site.mastodon -%}
    {%- if mst.username and mst.instance -%}
      <li>
        <a href="https://{{ mst.instance| cgi_escape | escape}}/@{{mst.username}}" title="Mastodon" aria-label="Mastodon">
          <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#mastodon' | relative_url }}"></use></svg>
        </a>
      </li>
    {%- endif -%}
  {%- endfor -%}
  {%- if site.linkedin_username -%}
    <li>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username| cgi_escape | escape }}" title="LinkedIn" aria-label="LinkedIn">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg>
      </a>
    </li>
  {%- endif -%}
  {%- if site.rss -%}
    <li>
      <a href="{{ 'feed.xml' | relative_url }}" title="RSS Feed" aria-label="RSS Feed">
        <svg class="svg-icon"><use xlink:href="{{ '/assets/minima-social-icons.svg#rss' | relative_url }}"></use></svg>
      </a>
    </li>
  {%- endif -%}
</ul>
