<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <p>{{- site.description | escape -}}</p>
      </div>

      <div class="footer-col footer-col-2">
        {%- if site.creative_commons -%}
        <p class="license-notice">
          <a href="https://creativecommons.org/licenses/{{ site.creative_commons }}/" rel="license" target="_blank" rel="noopener">
            <img alt="Creative Commons License" style="border-width:0; vertical-align: middle; margin-right: 0.3em;" src="https://i.creativecommons.org/l/{{ site.creative_commons }}/88x31.png" />
          </a>
          <br>
          Licensed under
          <a href="https://creativecommons.org/licenses/{{ site.creative_commons }}/" rel="license" target="_blank" rel="noopener">CC BY-NC-ND 3.0</a>.
        </p>
        {%- endif -%}
      </div>

      <div class="footer-col footer-col-3">
        {%- include social.html -%}
      </div>
    </div>

  </div>

</footer>
