# Jekyll + Beautiful Jekyll theme
# https://github.com/daattali/beautiful-jekyll

############################
# --- Theme --- #
############################

remote_theme: daattali/beautiful-jekyll

############################
# --- Site --- #
############################

title: "Diego's notes"
author: "Diego Lemos"
description: "Writing software that works (and occasionally taking notes)"

###############################################
# --- Navigation bar --- #
###############################################

navbar-links:
  Home: "index.html"
  About: "about"

################
# --- Footer --- #
################

# Optional: add social links (uncomment and fill as needed)
# social-network-links:
#   github: dlresende
#   twitter: yourhandle
#   linkedin: yourprofile

rss: true
url-pretty: "diegolemos.net"

# Creative Commons license (optional; set to license path to show in footer, e.g. "by-nc-nd/3.0")
creative_commons: "by-nc-nd/3.0"

###########################
# --- General --- #
###########################

title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: true
date_format: "%B %-d, %Y"

################
# --- Build --- #
################

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - README.md

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
